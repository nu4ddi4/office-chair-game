name: Test
on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: map-test-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    # Preserve the protected main branch's required check name.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Fetch the retained office map
        run: git lfs pull --include="godot/assets/models/Interior_07_Godot.glb" --exclude=""
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Lint the map workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Check geometry, movement, doors, pause and rendered input
        run: xvfb-run -a -s "-screen 0 1600x1200x24" python3 scripts/test-map.py --godot godot --rendered
      - name: Retain map review screens and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: office-map-review-${{ github.run_id }}
          path: map-results/
          if-no-files-found: ignore
          retention-days: 14
