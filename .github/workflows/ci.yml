name: Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tiny-office-test-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Verify solo and co-op shifts
        run: python3 prototype/tiny-office/tests/test_shift.py --godot godot
      - name: Build and verify checksums
        run: |
          python3 prototype/tiny-office/build.py --godot godot --deb
          cd prototype/tiny-office/dist
          sha256sum -c SHA256SUMS.txt
      - name: Verify server startup
        shell: bash
        working-directory: prototype/tiny-office/dist
        run: |
          tar -xzf TinyOffice-Linux-Server.tar.gz -C "$RUNNER_TEMP"
          server="$RUNNER_TEMP/TinyOffice-Linux-Server"
          config="$RUNNER_TEMP/tiny-office-test.cfg"
          (
            umask 077
            printf '[server]\nbind_address="127.0.0.1"\nport=30820\nroom_key="%s"\n' "$(openssl rand -hex 18)" > "$config"
          )
          timeout 15 "$server/tiny-office-server" --headless --quit-after 120 -- --config "$config" | tee "$RUNNER_TEMP/server.log"
          grep -q 'TINY_OFFICE_READY .*bind=127.0.0.1 udp=30820' "$RUNNER_TEMP/server.log"
      - uses: actions/upload-artifact@v4
        with:
          name: TinyOffice-packages
          path: prototype/tiny-office/dist/
          if-no-files-found: error
          retention-days: 14
